name: Cardiac Simulator Regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and matching Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          BROWSER=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' -print -quit)
          test -n "$BROWSER"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
          /usr/bin/chromium --version
      - name: Verify v1.8 functional regression
        run: python tests/test_v18.py
      - name: Verify v1.8 stress regression
        run: python tests/stress_v18.py
      - name: Verify v1.9 mechanical regression
        run: python tests/test_v19.py
      - name: Verify v1.10 Wiggers foundation and v1.9 equivalence
        run: python tests/test_v110.py
      - name: Verify v1.10 Patch 2 continuous pressure-volume profile
        run: python tests/test_v110_patch2.py
      - name: Verify v1.10 Patch 3 Wiggers SVG and UI integration
        run: python tests/test_v110_patch3.py

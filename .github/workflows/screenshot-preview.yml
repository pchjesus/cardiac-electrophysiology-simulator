name: Capture Real Patch 5 UI (preview branch only)
on:
  push:
    branches: [preview/v110-patch5-actual-screens]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium and Pillow
        run: |
          python -m pip install 'playwright==1.56.0' pillow
          python -m playwright install --with-deps chromium
          BROWSER=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' -print -quit)
          test -n "$BROWSER"
          sudo ln -sf "$BROWSER" /usr/bin/chromium
      - name: Capture actual app screenshots
        run: python tests/capture_current_ui_preview.py
      - name: Upload original app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-v1.10-patch5-screens
          path: screen-captures/
          retention-days: 30
          if-no-files-found: error
